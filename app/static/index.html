<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cerberus AI — Central CCTV Clean 2K</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css?v=20261021_clean">
</head>
<body class="clean-cctv-body">

  <!-- GRID CCTV 2X2 EM TELA INTEIRA -->
  <div class="cctv-grid-container" id="cctv-grid">
    <!-- CÂMERAS 1, 2 E 3 INJETADAS DINAMICAMENTE VIA JS -->

    <!-- 4º QUADRANTE: HORÁRIO & RADAR DE PRESENÇA -->
    <div class="cctv-quadrant-info" id="quadrant-info">
      
      <!-- WIDGET RELÓGIO MINIMALISTA (ESTILO CFTV) -->
      <div class="cctv-clock-widget">
        <span class="clock-greeting" id="clock-greeting">BOA TARDE</span>
        <div class="clock-display-frame">
          <span class="clock-digits" id="live-clock">--:--</span>
        </div>
        <span class="clock-date" id="live-date">Carregando data...</span>
        <span class="cctv-gpu-tag" id="cctv-gpu-tag">GTX 1660 • NVDEC ⚡</span>
      </div>

      <!-- RADAR DE PRESENÇA EM TEMPO REAL -->
      <div class="cctv-radar-widget">
        <div class="radar-header">
          <div class="radar-title-wrap">
            <span class="radar-live-beacon"></span>
            <span class="radar-title">RADAR DE PRESENÇA</span>
          </div>
          <a href="/dashboard" class="radar-dash-link" title="Abrir Dashboard Completo de Estatísticas">
            Dashboard ↗
          </a>
        </div>

        <div class="radar-events-feed" id="radar-events-feed">
          <div class="radar-empty" id="radar-empty">
            <span>Perímetro seguro. Nenhuma atividade recente.</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- MODAL MINIMALISTA DE INSPEÇÃO DE EVIDÊNCIA -->
  <div class="modal-backdrop" id="event-modal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title-group">
          <span class="modal-cam-badge" id="modal-camera-title">Câmera</span>
          <span class="modal-time-badge mono" id="modal-time">--:--:--</span>
        </div>
        <button class="modal-close-btn" id="modal-close">✕</button>
      </div>

      <div class="modal-body">
        <div class="modal-imgs-row">
          <div class="modal-img-box">
            <span class="box-tag">Recorte Biométrico</span>
            <img id="modal-crop-img" src="" alt="Recorte" class="modal-img">
          </div>
          <div class="modal-img-box full-box">
            <span class="box-tag">Quadro 2K com Bounding Box</span>
            <img id="modal-full-img" src="" alt="Cena Completa" class="modal-img">
          </div>
        </div>

        <div class="modal-meta-strip">
          <span class="meta-item">Rastreamento: <b class="mono" id="modal-track-id">#--</b></span>
          <span class="meta-item">Confiança: <b class="mono" id="modal-confidence">--%</b></span>
          <span class="meta-item">Evento: <b class="mono" id="modal-event-id">--</b></span>
          <a id="modal-full-raw-link" href="#" target="_blank" class="meta-link">Baixar Frame Nativo ↗</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/js/app.js?v=20261021_clean"></script>
</body>
</html>
